<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导入素材到画布</title>
<style>
body { margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; color: #333; }
.loading { text-align: center; }
.spinner { width: 32px; height: 32px; border: 3px solid #e0e0e0; border-top-color: #1677ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { color: #ff4d4f; font-size: 14px; }
</style>
</head>
<body>
<div class="loading" id="root">
  <div class="spinner"></div>
  <div>正在导入素材到画布...</div>
</div>
<script>
(function() {
  'use strict';

  const root = document.getElementById('root');
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const apiBase = params.get('api');
  const projectId = params.get('projectId');
  const canvasId = params.get('canvasId');

  if (!token || !apiBase) {
    root.innerHTML = '<div class="loading"><div class="error">缺少 token 或 API 地址参数</div></div>';
    return;
  }

  function nanoid(size) {
    size = size || 21;
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_-';
    let id = '';
    const bytes = new Uint8Array(size);
    crypto.getRandomValues(bytes);
    for (let i = 0; i < size; i++) {
      id += chars[bytes[i] % 64];
    }
    return id;
  }

  const STORE_KEY = 'infinite-canvas:canvas_store';
  const DB_NAME = 'infinite-canvas';
  const STORE_NAME = 'app_state';

  function processProjects(projects, nodes, connections) {
    let newId;
    if (canvasId) {
      const idx = projects.findIndex(p => p.id === canvasId);
      if (idx >= 0) {
        projects[idx].nodes = nodes || [];
        projects[idx].connections = connections || [];
        projects[idx].updatedAt = new Date().toISOString();
        newId = canvasId;
      } else {
        newId = createNewProject(projects, nodes, connections);
      }
    } else {
      newId = createNewProject(projects, nodes, connections);
    }
    return newId;
  }

  function createNewProject(projects, nodes, connections) {
    const newId = nanoid();
    const now = new Date().toISOString();
    projects.unshift({
      id: newId,
      title: '画布导入',
      createdAt: now,
      updatedAt: now,
      nodes: nodes || [],
      connections: connections || [],
      chatSessions: [],
      activeChatId: null,
      backgroundMode: 'lines',
      showImageInfo: false,
      viewport: { x: 0, y: 0, k: 1 },
    });
    return newId;
  }

  // localforage 存储格式: {key: key, value: value}，通过 key 索引查询
  // 见 localforage 源码: createObjectStore + createIndex('key', 'key', {unique: true})
  function readFromIDB(store) {
    return new Promise(function(resolve, reject) {
      try {
        var idx = store.index('key');
        var req = idx.get(STORE_KEY);
        req.onsuccess = function() { resolve(req.result ? req.result.value : null); };
        req.onerror = function() { reject(req.error); };
      } catch(e) {
        // 索引不存在，直接按 key 读
        var req = store.get(STORE_KEY);
        req.onsuccess = function() { resolve(req.result); };
        req.onerror = function() { reject(req.error); };
      }
    });
  }

  function writeToIDB(store, value) {
    return new Promise(function(resolve, reject) {
      // 按 localforage 格式存储: {key: key, value: value}
      var req = store.put({ key: STORE_KEY, value: value });
      req.onsuccess = resolve;
      req.onerror = function() { reject(req.error); };
    });
  }

  function saveViaIndexedDB(nodes, connections) {
    return new Promise(function(resolve, reject) {
      var req = indexedDB.open(DB_NAME);
      req.onupgradeneeded = function(e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          var os = db.createObjectStore(STORE_NAME, { keyPath: null, autoIncrement: false });
          os.createIndex('key', 'key', { unique: true });
          os.createIndex('value', 'value', { unique: false });
        }
      };
      req.onsuccess = function(e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.close();
          // 升级版本以创建 store
          var upReq = indexedDB.open(DB_NAME, db.version + 1);
          upReq.onupgradeneeded = function(ev) {
            var upDb = ev.target.result;
            var os = upDb.createObjectStore(STORE_NAME, { keyPath: null, autoIncrement: false });
            os.createIndex('key', 'key', { unique: true });
            os.createIndex('value', 'value', { unique: false });
          };
          upReq.onsuccess = function(ev) {
            doIDBWrite(ev.target.result, nodes, connections).then(resolve).catch(reject);
          };
          upReq.onerror = function() { reject(new Error('upgrade failed')); };
          return;
        }
        doIDBWrite(db, nodes, connections).then(resolve).catch(reject);
      };
      req.onerror = function() { reject(new Error('open failed')); };
    });
  }

  function doIDBWrite(db, nodes, connections) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(STORE_NAME, 'readwrite');
      var store = tx.objectStore(STORE_NAME);
      var projects = [];

      readFromIDB(store).then(function(existing) {
        if (existing) {
          try {
            var parsed = JSON.parse(existing);
            projects = parsed.state?.projects || [];
          } catch(e) {}
        }
        var newId = processProjects(projects, nodes, connections);
        var value = JSON.stringify({ state: { projects: projects }, version: 0 });
        // 同步写 localStorage
        try { localStorage.setItem(STORE_KEY, value); } catch {}

        writeToIDB(store, value).then(function() {
          // 验证
          readFromIDB(store).then(function(verify) {
            if (verify) resolve(newId);
            else reject(new Error('verify failed'));
          }).catch(function() { resolve(newId); });
        }).catch(function(err) {
          reject(err);
        });
      }).catch(function() {
        // 读失败，直接新建
        var newId = createNewProject(projects, nodes, connections);
        var value = JSON.stringify({ state: { projects: projects }, version: 0 });
        try { localStorage.setItem(STORE_KEY, value); } catch {}
        writeToIDB(store, value).then(function() { resolve(newId); }).catch(reject);
      });
    });
  }

  function fallbackToLocalStorage(nodes, connections) {
    var projects = [];
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        projects = parsed.state?.projects || [];
      }
    } catch(e) {}
    var newId = processProjects(projects, nodes, connections);
    var value = JSON.stringify({ state: { projects: projects }, version: 0 });
    try { localStorage.setItem(STORE_KEY, value); } catch(e) {}
    return newId;
  }

  function saveBinding(newId) {
    if (!canvasId && projectId) {
      fetch(apiBase + '/api/import/bind', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ projectId: parseInt(projectId), canvasId: newId, canvasTitle: '画布导入' }),
      }).catch(function() {});
    }
  }

  async function run() {
    // 1. 获取导入数据
    var res = await fetch(apiBase + '/api/import/get?token=' + encodeURIComponent(token));
    var data = await res.json();
    if (!data.success || !data.data) {
      root.innerHTML = '<div class="loading"><div class="error">导入数据不存在或已过期</div></div>';
      return;
    }

    var nodes = data.data.nodes || [];
    var connections = data.data.connections || [];

    // 2. 先写 localStorage 兜底
    var lsId = fallbackToLocalStorage(nodes, connections);

    // 3. 再写 IndexedDB（localforage 兼容格式）
    try {
      var idbId = await saveViaIndexedDB(nodes, connections);
      saveBinding(idbId);
      window.location.replace('/canvas/' + idbId);
    } catch(e) {
      // IndexedDB 失败，用 localStorage 的 ID 跳转
      saveBinding(lsId);
      window.location.replace('/canvas/' + lsId);
    }
  }

  run().catch(function(err) {
    root.innerHTML = '<div class="loading"><div class="error">导入失败: ' + (err.message || '未知错误') + '</div></div>';
  });
})();
</script>
</body>
</html>
