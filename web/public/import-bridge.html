<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导入素材到画布</title>
<style>
body { margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; color: #333; }
.loading { text-align: center; }
.spinner { width: 32px; height: 32px; border: 3px solid #e0e0e0; border-top-color: #1677ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { color: #ff4d4f; font-size: 14px; }
</style>
</head>
<body>
<div class="loading" id="root">
  <div class="spinner"></div>
  <div>正在导入素材到画布...</div>
</div>
<script>
(function() {
  'use strict';

  const root = document.getElementById('root');
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const apiBase = params.get('api');
  const projectId = params.get('projectId');
  const canvasId = params.get('canvasId');

  if (!token || !apiBase) {
    root.innerHTML = '<div class="loading"><div class="error">缺少 token 或 API 地址参数</div></div>';
    return;
  }

  function nanoid(size) {
    size = size || 21;
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_-';
    let id = '';
    const bytes = new Uint8Array(size);
    crypto.getRandomValues(bytes);
    for (let i = 0; i < size; i++) {
      id += chars[bytes[i] % 64];
    }
    return id;
  }

  const STORE_KEY = 'infinite-canvas:canvas_store';

  // 读取已保存的项目列表（兼容 IndexedDB 和 localStorage）
  function readProjects() {
    // 先从 localStorage 读取（canvas store 有 fallback 到此）
    try {
      const ls = localStorage.getItem(STORE_KEY);
      if (ls) {
        const parsed = JSON.parse(ls);
        if (parsed?.state?.projects) return parsed.state.projects;
      }
    } catch {}
    return null;
  }

  function saveToStorage(projects) {
    const value = JSON.stringify({ state: { projects: projects }, version: 0 });
    // 同时写入 localStorage（canvas store 的 fallback）
    try {
      localStorage.setItem(STORE_KEY, value);
    } catch {}
    return value;
  }

  function processProjects(projects, nodes, connections) {
    let newId;
    if (canvasId) {
      const idx = projects.findIndex(p => p.id === canvasId);
      if (idx >= 0) {
        projects[idx].nodes = nodes || [];
        projects[idx].connections = connections || [];
        projects[idx].updatedAt = new Date().toISOString();
        newId = canvasId;
      } else {
        newId = createNewProject(projects, nodes, connections);
      }
    } else {
      newId = createNewProject(projects, nodes, connections);
    }
    return newId;
  }

  function createNewProject(projects, nodes, connections) {
    const newId = nanoid();
    const now = new Date().toISOString();
    projects.unshift({
      id: newId,
      title: '画布导入',
      createdAt: now,
      updatedAt: now,
      nodes: nodes || [],
      connections: connections || [],
      chatSessions: [],
      activeChatId: null,
      backgroundMode: 'lines',
      showImageInfo: false,
      viewport: { x: 0, y: 0, k: 1 },
    });
    return newId;
  }

  async function run() {
    // 1. 获取导入数据
    const res = await fetch(apiBase + '/api/import/get?token=' + encodeURIComponent(token));
    const data = await res.json();
    if (!data.success || !data.data) {
      root.innerHTML = '<div class="loading"><div class="error">导入数据不存在或已过期</div></div>';
      return;
    }

    const { nodes, connections } = data.data;

    // 2. 尝试从 localStorage 读取已有项目（IndexedDB 不可用时兜底）
    let projects = readProjects() || [];

    if (projects.length > 0) {
      // localStorage 已有数据，直接操作
      const newId = processProjects(projects, nodes, connections);
      saveToStorage(projects);
      // 新建画布时保存绑定
      if (!canvasId && projectId) {
        fetch(apiBase + '/api/import/bind', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ projectId: parseInt(projectId), canvasId: newId, canvasTitle: '画布导入' }),
        }).catch(function() {});
      }
      window.location.replace('/canvas/' + newId);
      return;
    }

    // 3. localStorage 无数据，尝试 IndexedDB
    try {
      const dbRequest = indexedDB.open('infinite-canvas', 1);
      dbRequest.onupgradeneeded = function(e) {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('app_state')) {
          db.createObjectStore('app_state');
        }
      };

      dbRequest.onsuccess = function(e) {
        const db = e.target.result;
        const tx = db.transaction('app_state', 'readwrite');
        const store = tx.objectStore('app_state');
        const getRequest = store.get(STORE_KEY);
        getRequest.onsuccess = function() {
          const existing = getRequest.result;
          let projects = [];
          if (existing) {
            try {
              const parsed = JSON.parse(existing);
              projects = parsed.state?.projects || [];
            } catch {}
          }

          const newId = processProjects(projects, nodes, connections);
          const value = JSON.stringify({ state: { projects: projects }, version: 0 });
          // 同步写入 localStorage 确保一致性
          try { localStorage.setItem(STORE_KEY, value); } catch {}

          const setRequest = store.put(value, STORE_KEY);
          setRequest.onsuccess = function() {
            if (!canvasId && projectId) {
              fetch(apiBase + '/api/import/bind', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ projectId: parseInt(projectId), canvasId: newId, canvasTitle: '画布导入' }),
              }).catch(function() {});
            }
            window.location.replace('/canvas/' + newId);
          };
          setRequest.onerror = function() {
            // IndexedDB 写入失败，用 localStorage 兜底
            saveToStorage(projects);
            if (!canvasId && projectId) {
              fetch(apiBase + '/api/import/bind', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ projectId: parseInt(projectId), canvasId: newId, canvasTitle: '画布导入' }),
              }).catch(function() {});
            }
            window.location.replace('/canvas/' + newId);
          };
        };
        getRequest.onerror = function() {
          // IndexedDB 读取失败，用 localStorage 兜底
          const newId = processProjects(projects, nodes, connections);
          saveToStorage(projects);
          if (!canvasId && projectId) {
            fetch(apiBase + '/api/import/bind', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ projectId: parseInt(projectId), canvasId: newId, canvasTitle: '画布导入' }),
            }).catch(function() {});
          }
          window.location.replace('/canvas/' + newId);
        };
      };

      dbRequest.onerror = function() {
        // IndexedDB 完全不可用，回退到 localStorage
        fallbackToLocalStorage(nodes, connections);
      };
    } catch (e) {
      fallbackToLocalStorage(nodes, connections);
    }
  }

  function fallbackToLocalStorage(nodes, connections) {
    root.innerHTML = '<div class="loading"><div class="spinner"></div><div>使用 localStorage 模式导入...</div></div>';
    let projects = readProjects() || [];
    const newId = processProjects(projects, nodes, connections);
    saveToStorage(projects);
    if (!canvasId && projectId) {
      fetch(apiBase + '/api/import/bind', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ projectId: parseInt(projectId), canvasId: newId, canvasTitle: '画布导入' }),
      }).catch(function() {});
    }
    window.location.replace('/canvas/' + newId);
  }

  run().catch(function(err) {
    root.innerHTML = '<div class="loading"><div class="error">导入失败: ' + (err.message || '未知错误') + '</div></div>';
  });
})();
</script>
</body>
</html>
