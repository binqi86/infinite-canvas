<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导入素材到画布</title>
<style>
body { margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; color: #333; }
.loading { text-align: center; }
.spinner { width: 32px; height: 32px; border: 3px solid #e0e0e0; border-top-color: #1677ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { color: #ff4d4f; font-size: 14px; }
</style>
</head>
<body>
<div class="loading" id="root">
  <div class="spinner"></div>
  <div>正在导入素材到画布...</div>
</div>
<script>
(function() {
  'use strict';

  var root = document.getElementById('root');
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');
  var apiBase = params.get('api');
  var projectId = params.get('projectId');
  var canvasId = params.get('canvasId');

  if (!token || !apiBase) {
    root.innerHTML = '<div class="loading"><div class="error">缺少 token 或 API 地址参数</div></div>';
    return;
  }

  function nanoid(size) {
    size = size || 21;
    var chars = 'abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_-';
    var id = '';
    var bytes = new Uint8Array(size);
    crypto.getRandomValues(bytes);
    for (var i = 0; i < size; i++) {
      id += chars[bytes[i] % 64];
    }
    return id;
  }

  var STORE_KEY = 'infinite-canvas:canvas_store';
  var DB_NAME = 'infinite-canvas';
  var STORE_NAME = 'app_state';

  function processProjects(projects, nodes, connections) {
    var newId;
    if (canvasId) {
      var idx = projects.findIndex(function(p) { return p.id === canvasId; });
      if (idx >= 0) {
        projects[idx].nodes = nodes || [];
        projects[idx].connections = connections || [];
        projects[idx].updatedAt = new Date().toISOString();
        newId = canvasId;
      } else {
        newId = createNewProject(projects, nodes, connections);
      }
    } else {
      newId = createNewProject(projects, nodes, connections);
    }
    return newId;
  }

  function createNewProject(projects, nodes, connections) {
    var newId = nanoid();
    var now = new Date().toISOString();
    projects.unshift({
      id: newId,
      title: '画布导入',
      createdAt: now,
      updatedAt: now,
      nodes: nodes || [],
      connections: connections || [],
      chatSessions: [],
      activeChatId: null,
      backgroundMode: 'lines',
      showImageInfo: false,
      viewport: { x: 0, y: 0, k: 1 },
    });
    return newId;
  }

  // 与 localforage 完全一致的存储方式:
  //   setItem: store.put(value, key)
  //   getItem: store.get(key)
  // 参考: node_modules/localforage/src/drivers/indexeddb.js

  function openDB() {
    return new Promise(function(resolve, reject) {
      var req = indexedDB.open(DB_NAME);
      req.onupgradeneeded = function(e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME);
        }
      };
      req.onsuccess = function(e) {
        var db = e.target.result;
        // 如果 store 不存在（数据库由旧版本或不同代码创建），需要升级
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.close();
          var upReq = indexedDB.open(DB_NAME, db.version + 1);
          upReq.onupgradeneeded = function(ev) {
            ev.target.result.createObjectStore(STORE_NAME);
          };
          upReq.onsuccess = function(ev) { resolve(ev.target.result); };
          upReq.onerror = function() { reject(new Error('upgrade failed')); };
        } else {
          resolve(db);
        }
      };
      req.onerror = function(e) {
        reject(e.target.error || new Error('open failed'));
      };
    });
  }

  function getFromDB(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(STORE_NAME, 'readonly');
      var store = tx.objectStore(STORE_NAME);
      var req = store.get(STORE_KEY);
      req.onsuccess = function() { resolve(req.result); };
      req.onerror = function() { reject(req.error); };
    });
  }

  function putToDB(db, value) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(STORE_NAME, 'readwrite');
      var store = tx.objectStore(STORE_NAME);
      var req = store.put(value, STORE_KEY);
      req.onsuccess = function() { resolve(); };
      req.onerror = function() { reject(req.error); };
    });
  }

  function saveViaIndexedDB(nodes, connections) {
    return openDB().then(function(db) {
      return getFromDB(db).then(function(existing) {
        var projects = [];
        if (existing) {
          try {
            var parsed = typeof existing === 'string' ? JSON.parse(existing) : existing;
            projects = parsed.state?.projects || [];
          } catch(e) {}
        }
        var newId = processProjects(projects, nodes, connections);
        var value = JSON.stringify({ state: { projects: projects }, version: 0 });

        // 同步写入 localStorage 兜底
        try { localStorage.setItem(STORE_KEY, value); } catch(e) {}

        return putToDB(db, value).then(function() {
          return newId;
        });
      });
    });
  }

  function saveViaLocalStorage(nodes, connections) {
    var projects = [];
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        projects = parsed.state?.projects || [];
      }
    } catch(e) {}
    var newId = processProjects(projects, nodes, connections);
    var value = JSON.stringify({ state: { projects: projects }, version: 0 });
    try { localStorage.setItem(STORE_KEY, value); } catch(e) {}
    return newId;
  }

  function saveBinding(newId) {
    if (!canvasId && projectId) {
      fetch(apiBase + '/api/import/bind', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ projectId: parseInt(projectId), canvasId: newId, canvasTitle: '画布导入' }),
      }).catch(function() {});
    }
  }

  async function run() {
    var res = await fetch(apiBase + '/api/import/get?token=' + encodeURIComponent(token));
    var data = await res.json();
    if (!data.success || !data.data) {
      root.innerHTML = '<div class="loading"><div class="error">导入数据不存在或已过期</div></div>';
      return;
    }

    var nodes = data.data.nodes || [];
    var connections = data.data.connections || [];

    // 先写 localStorage 兜底
    var lsId = saveViaLocalStorage(nodes, connections);

    // 再写 IndexedDB（与 localforage 完全一致的格式）
    try {
      var idbId = await saveViaIndexedDB(nodes, connections);
      saveBinding(idbId);
      window.location.replace('/canvas/' + idbId);
    } catch(e) {
      // IndexedDB 失败，用 localStorage 的 ID
      saveBinding(lsId);
      window.location.replace('/canvas/' + lsId);
    }
  }

  run().catch(function(err) {
    root.innerHTML = '<div class="loading"><div class="error">导入失败: ' + (err.message || '未知错误') + '</div></div>';
  });
})();
</script>
</body>
</html>
