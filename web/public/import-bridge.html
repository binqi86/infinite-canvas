<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导入素材到画布</title>
<script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
<style>
body { margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; color: #333; }
.loading { text-align: center; }
.spinner { width: 32px; height: 32px; border: 3px solid #e0e0e0; border-top-color: #1677ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { color: #ff4d4f; font-size: 14px; }
</style>
</head>
<body>
<div class="loading" id="root">
  <div class="spinner"></div>
  <div>正在导入素材到画布...</div>
</div>
<script>
(function() {
  'use strict';

  const root = document.getElementById('root');
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const apiBase = params.get('api');
  const projectId = params.get('projectId');
  const canvasId = params.get('canvasId');

  if (!token || !apiBase) {
    root.innerHTML = '<div class="loading"><div class="error">缺少 token 或 API 地址参数</div></div>';
    return;
  }

  function nanoid(size) {
    size = size || 21;
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_-';
    let id = '';
    const bytes = new Uint8Array(size);
    crypto.getRandomValues(bytes);
    for (let i = 0; i < size; i++) {
      id += chars[bytes[i] % 64];
    }
    return id;
  }

  const STORE_KEY = 'infinite-canvas:canvas_store';

  // 与 canvas store 一致的 localforage 配置
  localforage.config({
    name: 'infinite-canvas',
    storeName: 'app_state',
  });

  function processProjects(projects, nodes, connections) {
    let newId;
    if (canvasId) {
      const idx = projects.findIndex(p => p.id === canvasId);
      if (idx >= 0) {
        projects[idx].nodes = nodes || [];
        projects[idx].connections = connections || [];
        projects[idx].updatedAt = new Date().toISOString();
        newId = canvasId;
      } else {
        newId = createNewProject(projects, nodes, connections);
      }
    } else {
      newId = createNewProject(projects, nodes, connections);
    }
    return newId;
  }

  function createNewProject(projects, nodes, connections) {
    const newId = nanoid();
    const now = new Date().toISOString();
    projects.unshift({
      id: newId,
      title: '画布导入',
      createdAt: now,
      updatedAt: now,
      nodes: nodes || [],
      connections: connections || [],
      chatSessions: [],
      activeChatId: null,
      backgroundMode: 'lines',
      showImageInfo: false,
      viewport: { x: 0, y: 0, k: 1 },
    });
    return newId;
  }

  async function run() {
    // 1. 获取导入数据
    const res = await fetch(apiBase + '/api/import/get?token=' + encodeURIComponent(token));
    const data = await res.json();
    if (!data.success || !data.data) {
      root.innerHTML = '<div class="loading"><div class="error">导入数据不存在或已过期</div></div>';
      return;
    }

    const { nodes, connections } = data.data;

    // 2. 使用 localforage 读取/写入（与 canvas store 完全一致）
    let raw;
    try {
      raw = await localforage.getItem(STORE_KEY);
    } catch (e) {
      // localforage 内部 IndexedDB 失败，尝试 localStorage 兜底
      try { raw = localStorage.getItem(STORE_KEY); } catch {}
    }

    let projects = [];
    if (raw) {
      try {
        const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
        projects = parsed.state?.projects || [];
      } catch {}
    }

    const newId = processProjects(projects, nodes, connections);
    const value = JSON.stringify({ state: { projects: projects }, version: 0 });

    // 3. 通过 localforage 写入 IndexedDB（与 canvas store 同样的存储路径）
    try {
      await localforage.setItem(STORE_KEY, value);
    } catch (e) {
      // localforage 写入失败，兜底到 localStorage
      try { localStorage.setItem(STORE_KEY, value); } catch {}
    }
    // 同步写入 localStorage 作为额外兜底
    try { localStorage.setItem(STORE_KEY, value); } catch {}

    // 4. 新建画布时保存绑定
    if (!canvasId && projectId) {
      fetch(apiBase + '/api/import/bind', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ projectId: parseInt(projectId), canvasId: newId, canvasTitle: '画布导入' }),
      }).catch(function() {});
    }

    window.location.replace('/canvas/' + newId);
  }

  run().catch(function(err) {
    root.innerHTML = '<div class="loading"><div class="error">导入失败: ' + (err.message || '未知错误') + '</div></div>';
  });
})();
</script>
</body>
</html>
